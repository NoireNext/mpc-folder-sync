# MPC Folder Sync - Konfiguration
#
# Bis zu 8 Ziele. Jedes Ziel beginnt mit einer Zeile [Name]; der Name erscheint auf der MPC
# bei "Target". Zeilen mit # sind Kommentare. Nach dem Aendern des Namens das Plugin
# neu laden (aus dem Insert entfernen und wieder hinzufuegen), alles andere gilt sofort beim
# naechsten Start.
#
# Beispiel (die # davor entfernen und die Werte anpassen):
#
# [Backup NAS]
# host   = 192.168.1.20
# user   = admin
# port   = 22
# source = /media/MPC-Projekte/
# dest   = /volume1/backup/mpc/
# key    = id_ed25519
# password = meinPasswort     (statt key; einfacher, aber weniger sicher)
# delete = no
# exclude = *.tmp
# exclude = .Trashes/
#
# Felder:
#   host    IP-Adresse oder Name des Ziels (nur Buchstaben, Ziffern, Punkt, Minus, Unterstrich)
#   user    SSH-Benutzer auf dem Ziel
#   port    SSH-Port (Standard 22)
#   source  Ordner AUF DER MPC, absolut, beginnt mit /. Mit / am Ende wird der Inhalt kopiert,
#           ohne / der Ordner selbst. Den richtigen Pfad zeigt foldersync.log nach dem ersten Start
#           (Liste "Eingehaengte Laufwerke").
#   dest    Ordner auf dem Ziel
#   key     privater SSH-Schluessel; relativ = Datei in diesem Content-Ordner
#   password  Alternative zum Schluessel: Passwort des SSH-Benutzers, einfach der Rest der Zeile
#           (Leerzeichen und Sonderzeichen sind erlaubt, keine Anfuehrungszeichen setzen).
#           Ist 'key' gesetzt, hat der Schluessel Vorrang. Das Passwort liegt im Klartext auf dem
#           Laufwerk der MPC: besser ein eigenes Konto nur fuer den Sync verwenden.
#   delete  yes = Dateien auf dem Ziel loeschen, die auf der MPC nicht mehr existieren (Spiegeln).
#           Standard no. Vorsicht: erst mit "Dry Run" testen.
#   exclude  Datei- oder Ordnermuster, das NICHT kopiert wird. Darf mehrfach vorkommen (eine Zeile
#            pro Muster), z. B.  exclude = *.tmp   exclude = .Trashes/   exclude = Samples/Cache/
#            Muster mit / am Ende gelten nur fuer Ordner. Mit delete = yes werden ausgeschlossene
#            Dateien auf dem Ziel nicht geloescht.
#   rsync_path   (optional) voller Pfad von rsync AUF DEM ZIEL, falls es dort nicht im Standard-PATH
#                liegt (z. B. /usr/syno/bin/rsync bei Synology, /opt/bin/rsync bei Entware).
#   ssh_command  (optional) eigener SSH-Aufruf fuer rsync -e, mit {port}, {key} und {known_hosts}.
#                Normalerweise nicht noetig: rsync und ein SSH-Client (dbclient) sind im Plugin enthalten.
#
# Hinweise:
#   * Bitte die IP-Adresse eintragen (".local"-Namen werden nicht aufgeloest).
#   * key: Schluessel von ssh-keygen OHNE Passwort (ed25519 empfohlen); er wird beim Sync
#     automatisch fuer den mitgelieferten SSH-Client umgewandelt.
